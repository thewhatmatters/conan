[package]
name = "app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
# Scheme validation for the browser view — only http/https may be loaded.
url = "2"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# WHA-38: `unstable` unlocks Window::add_child — embedding a native webview as a
# child of the main window, which is the only way to host a real browser inside
# a surface pane. Documented as "available on desktop and crate feature
# `unstable` only", so the API may move between minor versions; the version is
# pinned exactly for that reason.
tauri = { version = "=2.11.2", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
# US-011 (chat v1): native folder-picker dialog for the per-thread cwd chip.
tauri-plugin-dialog = "2"
# Self-update: the UI calls check()/downloadAndInstall() via the JS plugin,
# which round-trips through this Rust plugin. tauri-plugin-process supplies
# the relaunch() the UI calls after applying an update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
